# Talon CI — gates every push and pull request.
#
# Deliberately secret-free: unit, integration (faked providers/devices), and
# static checks only. No AI keys, no payment keys, no database access. A
# compromised or misconfigured CI run cannot touch real user data or money —
# there is nothing here worth stealing.
#
# Jobs run in parallel; the merge gate requires all of them green.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (vet + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.2"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # W13 agent-behavior gate: prompt/tool/guardrail edits change the
      # recorded request digests, so this reds until the goldens are
      # re-recorded (TALONSTUDIO_UPDATE_GOLDEN=1) — the transcript diff is
      # then what the PR reviews. The tree guard below proves the suite
      # never rewrites its own goldens inside CI.
      - name: Golden transcripts (agent-behavior gate)
        run: go test -count=1 ./internal/evals/golden/

      # H12/W14.4: the composition golden diff — --dump-config resolves the
      # document (base → profile → preset, LWW) and must byte-match
      # talon.composition.golden.json, so a wiring row never lands
      # unaudited. The flag exits before the db/AI client open, so this
      # step stays secret-free like everything else here.
      - name: Composition golden diff (dump-config)
        run: go run ./cmd/server --dump-config | diff - ../talon.composition.golden.json

      - name: Tests (with race detector)
        run: go test -count=1 -race ./...

      # The suite must be read-only with respect to the repo: a test (or
      # build step) that rewrites a tracked file is drift waiting to be
      # committed by whoever ran the gate. Fails on any modified tracked
      # file; untracked scratch is already covered by .gitignore.
      - name: Tree guard (gate must not modify tracked files)
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code

      - name: Rename guard (demowallet/demodapp)
        working-directory: ${{ github.workspace }}
        run: |
          # Solana's package/module names are upstream-owned and stay; everything
          # else must use demo* names (the de15eed rename broke 3 infra files).
          if grep -rn "fakewallet\|fakedapp\|FakeDapp\|FakeWallet" --include="*.go" --include="*.sh" --include="Dockerfile*" --include="*.ts" --include="*.tsx" . 2>/dev/null | grep -v "mobilewalletadapter\.fake\|android/fake\|:fake\|sourceModule\|verificationDapp\|upstream-owned" | grep -q .; then
            echo "Stale fakewallet/fakedapp reference found (see above). Use demowallet/demodapp, or add an upstream-owned exception with a comment.";
            exit 1;
          fi

      - name: Kit guard (no web3.js imports)
        working-directory: ${{ github.workspace }}
        run: |
          # The template migrated to @solana/kit (Phase 2 migration). Legacy
          # @solana/web3.js imports in template code or agent skills would
          # silently teach the model the wrong API. Docs may mention it for
          # migration context; code may not import it.
          if grep -rn "@solana/web3.js\|from ['\"]web3\|require(['\"]@solana/web3" --include="*.ts" --include="*.tsx" backend/template/app backend/template/components backend/template/features backend/template/lib backend/template/utils backend/internal/agent/content/skills/ 2>/dev/null | grep -v "kit-web3-interop\|legacy\|Legacy" | grep -q .; then
            echo "Legacy @solana/web3.js import found (see above). Use @solana/kit; migration context belongs in docs, not code.";
            exit 1;
          fi

  frontend:
    name: frontend (types + lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
